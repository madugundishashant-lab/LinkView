<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LinkView</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --bg: #ffffff;
            --surface: #fcfcfd;
            --text-main: #1a1a1a;
            --text-sub: #71717a;
            --accent: #000000;
            --border: #e4e4e7;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --nav-bg: rgba(255, 255, 255, 0.75);
        }

        /* Dark Mode Colors */
        body.dark-mode {
            --bg: #09090b;
            --surface: #18181b;
            --text-main: #fafafa;
            --text-sub: #a1a1aa;
            --accent: #ffffff;
            --border: #27272a;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --nav-bg: rgba(24, 24, 27, 0.8);
        }

        body {
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        header {
            padding: 60px 25px 15px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Dark Mode Toggle Switch */
        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }

        .screen {
            flex: 1;
            display: none;
            padding: 10px 25px 150px; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .friend-slide {
            background: var(--surface);
            padding: 22px;
            margin-bottom: 15px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .friend-slide:active { transform: scale(0.97); }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--text-sub);
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 5;
            opacity: 0.5;
        }

        #qrcode-container {
            background: white; /* Always white for QR scannability */
            padding: 25px;
            display: inline-block;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin: 30px 0;
        }

        #reader {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: #000;
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 8px; color: var(--text-sub); letter-spacing: 0.08em; }
        input, textarea, select {
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 1rem;
            outline: none;
            color: var(--text-main);
            transition: all 0.2s;
        }
        input:focus { border-color: var(--text-sub); }
        input:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .nav-container {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 380px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            display: flex;
            height: 75px;
            justify-content: space-around;
            align-items: center;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-sub);
            flex: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; stroke-width: 2px; }
        .nav-item.active-nav { color: var(--accent); }
        .nav-item.active-nav svg { transform: translateY(-2px); stroke-width: 2.5px; }

        .nav-item.active-nav::after {
            content: '';
            position: absolute;
            bottom: -8px;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: var(--bg); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); margin-top: 15px;}
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .social-tag { font-size: 0.7rem; font-weight: 600; color: var(--text-sub); background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 10px; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="light-mode">

    <header>
        <span id="app-title">LinkView</span>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </header>

    <div id="vault" class="screen active">
        <div id="list-container"></div>
    </div>

    <div id="handshake" class="screen" style="text-align:center;">
        <div id="my-qr-view">
            <div id="qrcode-container"></div>
            <p style="color: var(--text-sub); font-size: 0.9rem;">Scan to exchange identity</p>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="startScanner()">Scan Someone</button>
        </div>
        <div id="scanner-view" style="display:none;">
            <div id="reader"></div>
            <button class="btn btn-outline" onclick="stopScanner()">Cancel</button>
        </div>
    </div>

    <div id="profile" class="screen">
        <div class="input-group">
            <label>DISPLAY NAME</label>
            <input type="text" id="name" placeholder="Full Name">
        </div>
        <div class="input-group">
            <label>USERNAME (LOCKED AFTER SAVE)</label>
            <input type="text" id="username" placeholder="@handle">
        </div>
        <div class="input-group">
            <label>EMAIL ADDRESS</label>
            <input type="email" id="email" placeholder="hello@example.com">
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>AGE</label>
                <input type="number" id="age" placeholder="Age">
            </div>
            <div class="input-group">
                <label>GENDER</label>
                <select id="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <label style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 20px;">SOCIALS</label>
        <div class="grid-2">
            <div class="input-group"><input type="text" id="ig" placeholder="Instagram"></div>
            <div class="input-group"><input type="text" id="sc" placeholder="Snapchat"></div>
            <div class="input-group"><input type="text" id="tw" placeholder="Twitter"></div>
            <div class="input-group"><input type="text" id="li" placeholder="LinkedIn"></div>
            <div class="input-group"><input type="text" id="fb" placeholder="Facebook"></div>
            <div class="input-group"><input type="text" id="tg" placeholder="Telegram"></div>
        </div>

        <button class="btn btn-primary" onclick="saveMyData()">Secure Identity</button>
    </div>

    <div class="nav-container">
        <button class="nav-item active-nav" onclick="nav('vault', this, 'LinkView')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span style="font-size: 9px; font-weight: 800;">VAULT</span>
        </button>
        <button class="nav-item" onclick="nav('handshake', this, 'Handshake')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
            <span style="font-size: 9px; font-weight: 800;">SCAN</span>
        </button>
        <button class="nav-item" onclick="nav('profile', this, 'Identity')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span style="font-size: 9px; font-weight: 800;">ME</span>
        </button>
    </div>

    <script>
        let html5QrCode;
        let isProcessingScan = false;

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('linkview_theme', isDark ? 'dark' : 'light');
            icon.innerHTML = isDark ? 
                '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>' : 
                '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        }

        async function nav(screenId, btn, title) {
            await stopScanner();
            document.getElementById('app-title').innerText = screenId === 'vault' ? 'LinkView' : title;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(screenId).classList.add('active');
            btn.classList.add('active-nav');
            if(screenId === 'handshake') generateQR();
            if(screenId === 'vault') loadVault();
        }

        function saveMyData() {
            const current = JSON.parse(localStorage.getItem('linkview_me') || "{}");
            const user = {
                n: document.getElementById('name').value.trim(),
                u: current.u || document.getElementById('username').value.trim(),
                e: document.getElementById('email').value.trim(),
                a: document.getElementById('age').value,
                g: document.getElementById('gender').value,
                ig: document.getElementById('ig').value.trim(),
                sc: document.getElementById('sc').value.trim(),
                tw: document.getElementById('tw').value.trim(),
                li: document.getElementById('li').value.trim(),
                fb: document.getElementById('fb').value.trim(),
                tg: document.getElementById('tg').value.trim()
            };
            if(!user.n || !user.u) return alert("Missing required fields.");
            localStorage.setItem('linkview_me', JSON.stringify(user));
            document.getElementById('username').disabled = true;
            generateQR();
            alert("Identity Saved.");
        }

        function generateQR() {
            const container = document.getElementById("qrcode-container");
            container.innerHTML = "";
            const rawData = localStorage.getItem('linkview_me');
            if(!rawData) return;
            new QRCode(container, { text: rawData, width: 220, height: 220, colorDark: "#000000" });
        }

        async function startScanner() {
            document.getElementById('my-qr-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);
            } catch (err) { stopScanner(); }
        }

        async function onScanSuccess(decodedText) {
            if(isProcessingScan) return;
            isProcessingScan = true;
            try {
                const newFriend = JSON.parse(decodedText);
                if(newFriend.n && newFriend.u) {
                    let vault = JSON.parse(localStorage.getItem('linkview_vault') || "[]");
                    if(!vault.some(f => f.u === newFriend.u)) {
                        vault.unshift(newFriend);
                        localStorage.setItem('linkview_vault', JSON.stringify(vault));
                    }
                    await stopScanner();
                    nav('vault', document.querySelectorAll('.nav-item')[0], 'LinkView');
                }
            } catch(e) { isProcessingScan = false; }
        }

        async function stopScanner() {
            if (html5QrCode?.isScanning) await html5QrCode.stop();
            document.getElementById('my-qr-view').style.display = 'block';
            document.getElementById('scanner-view').style.display = 'none';
        }

        function deleteFriend(index, e) {
            e.stopPropagation();
            if(confirm("Delete connection?")) {
                let vault = JSON.parse(localStorage.getItem('linkview_vault') || "[]");
                vault.splice(index, 1);
                localStorage.setItem('linkview_vault', JSON.stringify(vault));
                loadVault();
            }
        }

        function openFriend(index) {
            const friends = JSON.parse(localStorage.getItem('linkview_vault') || "[]");
            const f = friends[index];
            const list = document.getElementById('list-container');
            document.getElementById('app-title').innerText = "Connection";
            list.innerHTML = `
                <button class="btn btn-outline" onclick="loadVault()" style="width:auto; margin-bottom:20px; padding:10px 20px;">← Vault</button>
                <div class="friend-slide">
                    <button class="delete-btn" onclick="deleteFriend(${index}, event)">✕</button>
                    <div style="font-weight:800; font-size:1.6rem;">${f.n}</div>
                    <div style="color:var(--text-sub); margin-bottom:15px;">@${f.u}</div>
                    <div style="font-size:0.9rem; margin-bottom:10px;">${f.g || '—'} • ${f.a || '—'} yrs</div>
                    <div style="color:var(--text-sub); font-size:0.85rem; margin-bottom:20px; border-bottom: 1px solid var(--border); padding-bottom:15px;">${f.e || 'No email shared'}</div>
                    <div class="social-grid">
                        ${f.ig ? `<div class="social-tag">IG: ${f.ig}</div>` : ''}
                        ${f.sc ? `<div class="social-tag">SC: ${f.sc}</div>` : ''}
                        ${f.tw ? `<div class="social-tag">TW: ${f.tw}</div>` : ''}
                        ${f.li ? `<div class="social-tag">LI: ${f.li}</div>` : ''}
                        ${f.tg ? `<div class="social-tag">TG: ${f.tg}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function loadVault() {
            const list = document.getElementById('list-container');
            document.getElementById('app-title').innerText = "LinkView";
            let friends = JSON.parse(localStorage.getItem('linkview_vault') || "[]");
            list.innerHTML = friends.length ? friends.map((f, i) => `
                <div class="friend-slide" onclick="openFriend(${i})">
                    <div style="font-weight:700; font-size:1.2rem;">${f.n}</div>
                    <div style="color:var(--text-sub); font-size:0.85rem;">@${f.u}</div>
                    <div style="position:absolute; right:20px; bottom:22px; font-size:0.65rem; font-weight:800; color:var(--text-sub); letter-spacing:1px;">VIEW</div>
                </div>
            `).join('') : "<div style='text-align:center; padding-top:100px; color:var(--text-sub); opacity:0.5;'>Vault is empty.</div>";
        }

        window.onload = () => {
            if(localStorage.getItem('linkview_theme') === 'dark') toggleTheme();
            const saved = JSON.parse(localStorage.getItem('linkview_me') || "{}");
            if(saved.u) {
                document.getElementById('name').value = saved.n || '';
                document.getElementById('username').value = saved.u;
                document.getElementById('username').disabled = true;
                document.getElementById('email').value = saved.e || '';
                document.getElementById('age').value = saved.a || '';
                document.getElementById('gender').value = saved.g || '';
                ['ig','sc','tw','li','fb','tg'].forEach(s => document.getElementById(s).value = saved[s] || '');
            }
            loadVault();
        };
    </script>
</body>
</html>
